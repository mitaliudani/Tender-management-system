name: JSP static security regression
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test Java security helpers
        run: mvn -q test
      - name: Verify access guards and scanner behavior
        run: node --test security/*.test.mjs
      - name: Block new known-pattern findings
        run: node security/scan.mjs --check
